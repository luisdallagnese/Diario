<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Diário de Classe</title>
<style>
:root{--bg:#f4f5f7;--cd:#fff;--so:#f3f4f6;--bd:#e2e5e9;--bs:#cfd4da;--tx:#1f2328;--t2:#667085;--ac:#1f6feb;--ab:#e6effd;--rd:#c5221f;--wn:#fff4e0;--wt:#8a5a00;--l1:90%;--l2:22%}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--cd:#1e2126;--so:#252930;--bd:#333943;--bs:#454c58;--tx:#e8eaed;--t2:#9aa3b0;--ac:#7aa7ff;--ab:#243556;--rd:#ff8a84;--wn:#3a2f17;--wt:#f0c36d;--l1:26%;--l2:86%}}
body{font:14px/1.45 system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
h1,h2{font-weight:600}h2{font-size:16px;margin:0 0 12px}
#ini{padding:40px 20px;max-width:560px;margin:0 auto}#ini:empty{display:none}#wrap{display:none;min-height:100vh}
#menu{width:236px;flex:none;box-sizing:border-box;padding:18px 14px;background:var(--cd);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
#menu img{height:40px;align-self:flex-start}#menu h1{font-size:17px;margin:4px 0 12px}#menu .lb{font-size:11px;color:var(--t2);margin:4px 0 -2px}#menu select{width:100%;margin-bottom:10px}
#menu button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--t2);padding:9px 10px;border-radius:8px;text-align:left}
#menu button:hover{background:var(--so)}#menu button.on{background:var(--ab);color:var(--ac);font-weight:600}
#menu button.go{margin-top:auto;background:var(--tx);color:var(--cd);justify-content:center;font-weight:600}
#menu svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{flex:1;padding:22px;max-width:980px;min-width:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin:0 0 16px}
input,textarea,select{font:inherit;padding:6px 8px;border:1px solid var(--bs);border-radius:8px;background:var(--cd);color:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac)}
button{font:inherit;padding:6px 14px;cursor:pointer;border:1px solid var(--bs);border-radius:8px;background:var(--cd);color:inherit}button:hover{background:var(--so)}
label{margin-right:14px}.g{color:var(--t2)}.r{color:var(--rd)}
.row{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}.row textarea{width:100%;box-sizing:border-box}.row p{margin-top:0}.col{display:flex;flex-direction:column;gap:8px}
.tabs{display:inline-flex;background:var(--so);border:1px solid var(--bd);border-radius:10px;padding:3px;margin:0 0 14px;gap:2px}
.tabs button{border:0;background:none;color:var(--t2);padding:6px 16px;border-radius:7px}.tabs button.on{background:var(--ab);color:var(--ac);font-weight:600}
.nt{table-layout:fixed;width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin:6px 0 16px}
.nt th{height:42px;line-height:1.2;vertical-align:middle;background:var(--so);color:var(--t2);font-weight:600;font-size:12px;padding:4px}
.nt td{border-top:1px solid var(--bd);padding:4px 6px;text-align:center}.nt tr:nth-child(even) td{background:var(--so)}
.nt td:nth-child(2),.nt th:nth-child(2){text-align:left}.nt input{width:100%;box-sizing:border-box;text-align:center}.nt input:disabled{opacity:.5}
.row p input:not([style*=width]){width:170px}.ctr{align-items:center}.cron{display:grid;gap:8px}.cd{background:var(--so);border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:6px}.cd.hj{border-color:var(--ac)}.ch{font-weight:600;font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.03em}.chip{background:hsl(var(--h) 65% var(--l1));color:hsl(var(--h) 45% var(--l2));border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.25}.aviso{background:var(--wn);color:var(--wt);border-radius:8px;padding:8px 12px;margin:0 0 12px}.al,.fh{display:grid;grid-template-columns:22px 1fr 64px 64px 64px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd);margin:0}.fh{font-size:12px;color:var(--t2);font-weight:600;padding-bottom:6px}.fh span,.fc{text-align:center}.fc.r{color:var(--rd);font-weight:600}.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#msg{font-size:12px;color:var(--t2);word-break:break-word}
</style>
<body><div id="ini"></div><div id="wrap"><nav id="menu"><img src="https://www.udc.edu.br/libwww/udc/uploads/uploadsUnidade/20082026163316logoudc.jpg" alt="UDC" onerror="this.style.display='none'"><h1>Diário de Classe</h1><div class="lb">Disciplina</div><select id="dsel" onchange="trocar(this.value)"></select><button id="b_geral" onclick="ir('geral')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Geral</button><button id="b_chamada" onclick="ir('chamada')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Chamada</button><button id="b_notas" onclick="ir('notas')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Notas</button><button id="b_cronograma" onclick="ir('cronograma')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Cronograma</button><button class="go" onclick="gerar(true)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Gerar PDFs de todas as disciplinas</button><div id="msg"></div><div class="g" style="font-size:11px">Versão 8 · 16/11/2026</div></nav><main id="app"></main></div>
<script src="lib/pdf-lib.min.js"></script><script src="motor.js?v=8"></script>
<script>
let S,I,D,RAW,dk,sel,nb=0;const $=id=>document.getElementById(id),DIAS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const hoje=new Date().toLocaleDateString('sv'),br=i=>i.split('-').reverse().join('/'),num=v=>{v=parseFloat(String(v).replace(',','.'));return isNaN(v)?null:v};
const up=x=>Math.ceil(Math.round(x*2*1e6)/1e6)/2,fm=v=>v==null?'':v.toFixed(1).replace('.',','),esc=v=>String(v).replace(/"/g,'&quot;');
const ord=()=>Object.keys(I).sort((a,b)=>RAW[a].nome.localeCompare(RAW[b].nome,'pt')||I[a].sem.localeCompare(I[b].sem)),cur=()=>S.disc[dk],rec=(k,d)=>{const a=S.disc[k].aulas[d];return !!a&&Object.keys(a.falt).length>0},pend=k=>D[k].filter(x=>x.d<=hoje&&!rec(k,x.d)).length;
const aula=()=>cur().aulas[sel]=cur().aulas[sel]||{falt:{},conteudo:""};
async function save(re){D=(await(await fetch('/api/state',{method:'POST',body:JSON.stringify(S)})).json()).datas;if(re)render()}
function ensure(){if(!sel)return;const a=aula();for(const t in I[dk].turmas)a.falt[t]=a.falt[t]||[]}
function ultima(k){const l=D[k]||[];return(l.filter(x=>x.d<=hoje).pop()||l[0]||{}).d}
function inicial(){for(const k of ord())if(D[k].some(x=>x.d==hoje&&!rec(k,x.d)))return[k,hoje];for(const k of ord())if(D[k].some(x=>x.d==hoje))return[k,hoje];let b=null;
 for(const k of ord())for(const x of D[k])if(x.d<=hoje&&!rec(k,x.d)&&(!b||x.d>b[1]))b=[k,x.d];if(b)return b;const k=ord()[0];return[k,ultima(k)]}
async function load(){const r=await(await fetch('/api/state')).json();S=r.S;I=r.info;D=r.datas;RAW=r.raw||I;
 if(Object.keys(I).length){if(!dk||!I[dk]||!S.disc[dk])[dk,sel]=inicial();ensure();await save()}render()}
function cfg(k,v){cur()[k]=v;save(true)}
function trocar(k){xAviso='';dk=k;sel=ultima(k);ensure();save(true)}
function falt(t,ra,on){ensure();const a=aula();a.falt[t]=a.falt[t].filter(x=>x!=ra);if(on)a.falt[t].push(ra);save();fcnt(t,ra)}
function limpar(){aula().falt={};save(true)}
function nsem(v){const c=cur().ciclo;v=+v;while(c.length<v)c.push([]);c.length=v;save(true)}
const ed=(i,j,k,v)=>{cur().ciclo[i][j][k]=+v;save(true)},rm=(i,j)=>{cur().ciclo[i].splice(j,1);save(true)},add=i=>{cur().ciclo[i].push({dia:1,n:2});save(true)};
function calc(c,t,ra){const m=((c.notas[t]||{})[ra])||{};
 const mb=b=>{let s=0,p=0;for(const k of c.comp[b]){const v=num((m[b]||{})[k.id]);if(v==null)return null;s+=v*k.peso;p+=+k.peso}return p?up(s/p):null};
 const m1=mb(1),m2=mb(2);let fin=null,prec=false;
 if(m1!=null&&m2!=null){const x=up((m1+m2)/2);if(x>=4&&x<7){prec=true;const e=num(m.ex);if(e!=null)fin=up((x+e)/2)}else fin=x}
 return{m1,m2,fin,prec,ex:m.ex}}
function upd(t,ra){const r=calc(cur(),t,ra),k=t+ra,w=(i,v)=>{const e=$(i+k);if(e)e.textContent=fm(v)};w('a',nb==1?r.m1:r.m2);w('p',r.m1);w('q',r.m2);w('d',r.fin);const e=$('e'+k);if(e)e.disabled=!r.prec}
function mm(t,ra){const n=cur().notas;return((n[t]=n[t]||{})[ra]=n[t][ra]||{})}
function nt(t,ra,b,id,v){const m=mm(t,ra);(m[b]=m[b]||{})[id]=v;save();upd(t,ra)}
function nex(t,ra,v){mm(t,ra).ex=v;save();upd(t,ra)}
const nid=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const cn=(b,i,k,v)=>{cur().comp[b][i][k]=k=='peso'?(num(v)||0):v;save(true)},crm=(b,i)=>{cur().comp[b].splice(i,1);save(true)},cadd=b=>{cur().comp[b].push({id:nid(),nome:cur().comp[b].some(k=>k.nome=='Trabalho')?'Nova nota':'Trabalho',peso:0});save(true)};
async function gerar(todas){$('msg').textContent='Gerando...';const r=await(await fetch('/api/gerar',{method:'POST',body:JSON.stringify({d:todas?null:dk})})).json();$('msg').textContent=r.erro?'Erro: '+r.erro:'Pronto! '+r.ok.length+' PDF(s) gerado(s) na pasta "PDFs gerados".'}
const lims=t=>{const l=I[dk].turmas[t].lim,v=l&&(l[1]??l[2]);return v==null?null:v},chLim=()=>{const c=cur(),t=c.ciclo.reduce((q,w)=>q+w.reduce((r,e)=>r+(+e.n||0),0),0);return c.ciclo.length?t/c.ciclo.length*2*2.5:0},over=(t,b,n)=>{const L=chLim();return b==0&&L>0&&n>L},fcel=(t,ra,b,n)=>`<span class="fc${over(t,b,n)?' r':''}" id="f${b}${t}${ra}">${n}</span>`;
function faltasDe(t,ra){const f=[0,0,0];for(const b of[1,2])for(const iso of D[dk].filter(x=>x.bim==b).flatMap(x=>Array(x.n).fill(x.d)).slice(0,42)){const l=((cur().aulas[iso]||{}).falt||{})[t];if(l&&l.includes(ra))f[b]++}f[0]=f[1]+f[2];return f}
function fcnt(t,ra){const f=faltasDe(t,ra);for(const b of[1,2,0]){const e=$('f'+b+t+ra);if(e){e.textContent=f[b];e.classList.toggle('r',over(t,b,f[b]))}}}
function limUI(d){const ts=Object.keys(d.turmas).filter(t=>lims(t)!=null),ch=chLim();
 return`<div class="row" style="margin:6px 0 12px"><div class=g>`+(ts.length?'Limite de Faltas pelo Diário: '+(ts.every(t=>lims(t)==lims(ts[0]))?`<b>${lims(ts[0])}</b>`:ts.map(t=>`${t}: <b>${lims(t)}</b>`).join(' · ')):'')+`</div><div class=g>`+(ch?`Limite de Faltas pela Carga Horária: <b>${fm(ch).replace(',0','')}</b>`:'')+`</div></div>`}
const aulasEm=(d,ex)=>Object.keys(I).filter(k=>k!=ex).map(k=>({k,n:(D[k]||[]).filter(x=>x.d==d).reduce((q,x)=>q+x.n,0)})).filter(x=>x.n),
 avisoH=l=>l.length?`<div class=aviso>⚠ Nesta data já há aula de: ${l.map(x=>`<b>${I[x.k].nome}</b>${x.k==dk?' (esta disciplina)':''} — ${x.n} ${x.n>1?'aulas':'aula'}`).join(' · ')}</div>`:'';
function avulsaUI(){const ex=cur().extras||[];return cd(`<h2>Aula avulsa</h2><div class=g style="margin-bottom:8px">Lance uma aula fora do padrão da disciplina. Ela entra na lista de aulas abaixo.</div><label>Data <input type=date id=xd onchange="$('xa').innerHTML=this.value?avisoH(aulasEm(this.value,null)):''"></label><label>Aulas <select id=xn>${[1,2,3,4,5,6].map(n=>`<option ${n==2?'selected':''}>${n}</option>`).join('')}</select></label><button onclick="xadd()">Adicionar aula avulsa</button><div id=xa style="margin-top:8px">${xAviso}</div>`+(ex.length?`<p class=g style="margin:10px 0 0">Aulas avulsas lançadas: `+ex.map((e,i)=>`${br(e.d)} (${e.n}) <button onclick="xrm(${i})">✕</button>`).join(' ')+'</p>':''))}
let xAviso='';
async function xadd(){const d=$('xd').value,n=+$('xn').value;if(!d)return alert('Escolha a data da aula avulsa.');xAviso=avisoH(aulasEm(d,null));const c=cur();c.extras=c.extras||[];const e=c.extras.find(q=>q.d==d);if(e)e.n=n;else c.extras.push({d,n});await save();sel=d;ensure();await save(true)}
async function xrm(i){cur().extras.splice(i,1);await save(true)}
function pgCron(){const NM=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'],hj=(new Date().getDay()+6)%7,cel=NM.map(()=>[]);
 for(const k of ord()){const c=S.disc[k].ciclo,nome=RAW[k].nome,h=[...nome].reduce((a,ch)=>(a*31+ch.charCodeAt(0))%360,7),dias=w=>new Set(w.map(e=>+e.dia));
  if(c.length==2){const a=dias(c[0]),b=dias(c[1]);for(const d of new Set([...a,...b]))cel[d].push({nome:nome+(a.has(d)&&b.has(d)?'':' 15x15'),h})}
  else for(const d of new Set(c.flatMap(w=>[...dias(w)])))cel[d].push({nome,h})}
 const n=cel[6].length?7:6;
 return'<h2>Cronograma semanal</h2><div class=g style="margin-bottom:12px">Apenas visualização. "15x15" indica aula quinzenal (semana sim, semana não).</div>'+`<div class=cron style="grid-template-columns:repeat(${n},minmax(0,1fr))">`+NM.slice(0,n).map((d,i)=>`<div class="cd${i==hj?' hj':''}"><div class=ch>${d}</div>`+(cel[i].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(x=>`<div class=chip style="--h:${x.h}">${x.nome}</div>`).join('')||'<div class=g style="padding:2px">—</div>')+'</div>').join('')+'</div>'}
function secoes(){if(!dk){$('app').innerHTML='<p class=r>Nenhum diário em PDF encontrado na pasta escolhida.</p>';return}
const c=cur(),d=I[dk],a=c.aulas[sel]||{falt:{},conteudo:""},ds=D[dk];
let h=`<h2>Semestre e Feriados</h2><div class=row><div class=col><label>Início do semestre <input type=date value="${S.inicio}" onchange="S.inicio=this.value;save(true)"></label><label>Final do semestre <input type=date value="${S.fim}" onchange="S.fim=this.value;save(true)"></label></div><div>Feriados e dias sem aula:<br><textarea rows=2 cols=50 onchange="S.feriados=this.value;save(true)">${S.feriados}</textarea><div class=g>dd/mm/aaaa, separados por espaço ou vírgula</div></div></div>
<h2>Disciplina</h2><select onchange="trocar(this.value)">${ord().map(k=>{const p=pend(k),t=D[k].some(x=>x.d==hoje);return`<option value="${k}" ${k==dk?'selected':''}>${RAW[k].nome}${t?' • aula hoje':''}${p?' • '+p+' sem presença':''}</option>`}).join('')}</select>
<span class=g> Turmas: ${Object.keys(d.turmas).join(', ')}</span>${Object.entries(d.turmas).filter(x=>x[1].dup).map(x=>`<div class=g>Turma ${x[0]}: havia PDFs repetidos; usando o mais recente (${x[1].f}).</div>`).join('')}<br><br>
<div class=row><div><label>Avaliação do 1º bim. <input type=date value="${c.aval1}" onchange="cfg('aval1',this.value)"></label></div><div><b>Padrão de aulas</b> — semanas no ciclo: <select onchange="nsem(this.value)">${[1,2].concat(c.ciclo.length>2?[c.ciclo.length]:[]).map(n=>`<option ${n==c.ciclo.length?'selected':''}>${n}</option>`).join('')}</select><br>`+
c.ciclo.map((w,i)=>`<div style="margin:6px 0 10px"><b>Semana ${i+1}:</b>`+w.map((e,j)=>`<div style="margin:3px 0"><select style="width:110px" onchange="ed(${i},${j},'dia',this.value)">${DIAS.map((n,q)=>`<option value=${q} ${q==e.dia?'selected':''}>${n}</option>`).join('')}</select> <select style="width:52px" onchange="ed(${i},${j},'n',this.value)">${[1,2,3,4,5,6].map(q=>`<option ${q==e.n?'selected':''}>${q}</option>`).join('')}</select> aulas <button onclick="rm(${i},${j})">✕</button></div>`).join('')+`<button onclick="add(${i})">+ dia</button></div>`).join('')+'</div></div>';
h+='<div class=row>'+[1,2].map(b=>{const l=c.comp[b],s=l.reduce((a,k)=>a+(+k.peso||0),0);return`<p><b>Composição da nota — ${b}º bim.</b><br>`+l.map((k,i)=>`<input value="${esc(k.nome)}" onchange="cn(${b},${i},'nome',this.value)"> <input style="width:50px" value="${k.peso}" onchange="cn(${b},${i},'peso',this.value)">% <button onclick="crm(${b},${i})">✕</button><br>`).join('')+`<button onclick="cadd(${b})">+ componente</button> <span class="${s==100?'g':'r'}">soma: ${s}%${s==100?'':' (deveria ser 100%)'}</span></p>`}).join('')+'</div>';
h+=`<div class=g>${ds.length} dias de aula: `+[1,2].map(b=>{const n=ds.filter(x=>x.bim==b).reduce((s,x)=>s+x.n,0);return`<span class="${n>42?'r':''}">${b}º bim. ${n} aulas${n>42?' (máx. 42 colunas no PDF!)':''}</span>`}).join(' · ')+'</div>';
h+=`<h2>Aula do dia</h2><div class="row ctr"><div><select onchange="sel=this.value;ensure();save(true)">${ds.map(x=>`<option value="${x.d}" ${x.d==sel?'selected':''}>${rec(dk,x.d)?'✓ ':''}${br(x.d)} • ${x.n} aulas (${x.bim}º bim.)${(c.extras||[]).some(e=>e.d==x.d)?' • avulsa':''}</option>`).join('')}</select></div>`;
h+=sel?`<div>Conteúdo (vale para todas as turmas):<br><textarea rows=2 cols=70 onchange="aula().conteudo=this.value;save()">${a.conteudo||''}</textarea></div></div>`:'</div>';if(sel){
const al=[];for(const t in d.turmas)for(const x of d.turmas[t].al)al.push({t,ra:x.ra,nome:x.nome});al.sort((p,q)=>p.nome.localeCompare(q.nome,'pt'));
h+=limUI(d)+'<p><b>Marque quem faltou</b> (✓ na data = presença já lançada) <button onclick="limpar()">Desfazer lançamento desta data</button></p><div class=fh><span></span><span></span><span>1º bim</span><span>2º bim</span><span>Total</span></div>'+al.map(x=>{const f=faltasDe(x.t,x.ra);return`<label class=al><input type=checkbox ${(a.falt[x.t]||[]).includes(x.ra)?'checked':''} onchange="falt('${x.t}','${x.ra}',this.checked)"><span class=an>${x.nome} <span class=g>(${x.t})</span></span>${[1,2,0].map(b=>fcel(x.t,x.ra,b,f[b])).join('')}</label>`}).join('')}
h+=uniUI();return h}
let pg=null;const cd=h=>'<section class=card>'+h+'</section>';
function ir(p){pg=p;xAviso='';render()}
function sec(){const o={};for(const p of secoes().split('<h2>').slice(1))o[p.split('</h2>')[0]]='<h2>'+p;return o}
function render(){$('wrap').style.display='flex';
 if(!dk){$('app').innerHTML=cd((G.pasta||'')+'<p class=r>Nenhum diário em PDF encontrado na pasta escolhida.</p>');menu();return}
 if(!pg)pg=(!S.inicio||!S.fim||!cur().aval1)?'geral':'chamada';if(!sel||!(D[dk]||[]).some(x=>x.d==sel)){sel=ultima(dk);if(sel)ensure()}const x=sec();
 const dsc=x['Disciplina'].replace('Disciplina</h2>',`Configuração da disciplina</h2><b>${I[dk].nome}</b> (${I[dk].sem})<br>`).replace(/<select onchange="trocar[\s\S]*?<\/select>/,'');$('app').innerHTML=pg=='geral'?(G.pasta?cd(G.pasta):'')+cd(x['Semestre e Feriados'])+cd(dsc)+cd(x['Unificar disciplinas']):pg=='notas'?cd(pgNotas()):pg=='cronograma'?cd(pgCron()):avulsaUI()+cd(x['Aula do dia']);menu()}
function menu(){$('dsel').innerHTML=ord().map(k=>{const p=pend(k),t=D[k].some(x=>x.d==hoje);return`<option value="${k}" ${k==dk?'selected':''}>${RAW[k].nome}${t?' • aula hoje':''}${p?' • '+p+' sem presença':''}</option>`}).join('');for(const p of['geral','chamada','notas','cronograma'])$('b_'+p).className=p==pg?'on':''}
function pgNotas(){const c=cur(),d=I[dk],cp=nb?c.comp[nb]:null;
 let h='<h2>Notas</h2>'+'<div class=tabs>'+[[0,'Geral'],[1,'1º bim'],[2,'2º bim']].map(([v,l])=>`<button class="${nb==v?'on':''}" onclick="nb=${v};render()">${l}</button>`).join('')+'</div><br>';
 for(const t in d.turmas){h+=`<b>${t}</b><table class=nt><colgroup><col width=40><col>${'<col width=120>'.repeat(nb?cp.length+1:4)}</colgroup><tr><th>Nº<th>Aluno`+(nb?cp.map(k=>`<th>${k.nome}<br>(${k.peso}%)`).join('')+`<th>Média<br>${nb}º bim`:'<th>Média<br>1º bim<th>Média<br>2º bim<th>Exame<th>Final')+'</tr>'+d.turmas[t].al.map(x=>{const m=((c.notas[t]||{})[x.ra])||{},r=calc(c,t,x.ra),k=t+x.ra;
  return`<tr><td>${x.n}<td class=nm>${x.nome}`+(nb?cp.map(q=>`<td><input value="${esc(((m[nb]||{})[q.id])??'')}" onchange="nt('${t}','${x.ra}',${nb},'${q.id}',this.value)">`).join('')+`<td id="a${k}">${fm(nb==1?r.m1:r.m2)}`:`<td id="p${k}">${fm(r.m1)}<td id="q${k}">${fm(r.m2)}<td><input id="e${k}" value="${esc(m.ex??'')}" ${r.prec?'':'disabled'} onchange="nex('${t}','${x.ra}',this.value)"><td id="d${k}">${fm(r.fin)}`)+'</tr>'}).join('')+'</table><br>'}
 return h}
function uniUI(){const u=S.uni||{},all=Object.keys(RAW),gr=all.filter(p=>all.some(x=>u[x]==p)),livres=all.filter(x=>!u[x]).sort((a,b)=>RAW[a].nome.localeCompare(RAW[b].nome,'pt'));

 h+=gr.map(p=>`<p>Unificadas: <b>${I[p].nome}</b> (dados da principal: ${RAW[p].nome}) <button onclick="des('${p}')">Desfazer</button></p>`).join('');
 if(livres.length>1)h+='<p><b>Nova unificação</b> — círculo: disciplina principal (seus dados valem para todas); quadrado: disciplinas a unir</p>'+livres.map(k=>`<div><input type=radio name=up value="${k}"> <input type=checkbox class=uc value="${k}"> ${RAW[k].nome} (${RAW[k].sem}) <span class=g>${Object.keys(RAW[k].turmas).join(', ')}</span></div>`).join('')+'<button onclick="uni()">Unificar</button>';
 return h}
async function uni(){const p=(document.querySelector('input[name=up]:checked')||{}).value,os=[...document.querySelectorAll('.uc:checked')].map(x=>x.value).filter(x=>x!=p);
 if(!p||!os.length)return alert('Marque a disciplina principal (círculo) e pelo menos outra para unir (quadrado).');
 if(os.some(x=>RAW[x].sem!=RAW[p].sem))return alert('Só dá para unificar disciplinas do mesmo semestre.');
 S.uni=S.uni||{};for(const x in S.uni)if(os.includes(S.uni[x]))S.uni[x]=p;for(const x of os)S.uni[x]=p;dk=p;await save();sel=ultima(p);await load()}
async function des(p){for(const x in S.uni)if(S.uni[x]==p)delete S.uni[x];dk=p;await save();await load()}
const G={dir:null,out:null,files:[],info:{},S:null,timer:null},jr=o=>({json:async()=>o});
const idb=(m,v)=>new Promise((ok,no)=>{const q=indexedDB.open('diario',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>no(q.error);q.onsuccess=()=>{try{const s=q.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),r=m=='get'?s.get('dir'):s.put(v,'dir');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}});
const wr=async(h,n,d)=>{const w=await(await h.getFileHandle(n,{create:true})).createWritable();await w.write(d);await w.close()};
function gravar(){clearTimeout(G.timer);G.timer=setTimeout(()=>wr(G.out,'progresso.json',JSON.stringify(G.S,null,1)).catch(e=>$('msg')&&($('msg').textContent='Erro ao salvar: '+e.message)),300)}
window.fetch=async(u,o={})=>{const b=o.body?JSON.parse(o.body):null;
 if(u=='/api/state'){if(b){G.S=b;gravar();return jr({datas:Motor.alld(G.S)})}return jr({S:G.S,info:Motor.unir(G.info,G.S),raw:G.info,datas:Motor.alld(G.S)})}
 try{const r=await Motor.gerar(G.files,G.S,Motor.unir(G.info,G.S),b.d);for(const x of r)await wr(G.out,x.name,x.bytes);return jr({ok:r.map(x=>x.name)})}catch(e){return jr({erro:e.message})}};
async function lerPasta(){G.files=[];for await(const[n,h]of G.dir.entries())if(h.kind=='file'&&n.toLowerCase().endsWith('.pdf')){const f=await h.getFile();G.files.push({name:n,bytes:new Uint8Array(await f.arrayBuffer()),m:f.lastModified})}
 G.info=await Motor.scan(G.files);G.out=await G.dir.getDirectoryHandle('PDFs gerados',{create:true});
 try{G.S=JSON.parse(await(await(await G.out.getFileHandle('progresso.json')).getFile()).text())}catch{G.S=null}G.S=Motor.loadS(G.S,G.info)}
async function abrir(h){try{if(await h.requestPermission({mode:'readwrite'})!='granted')return;G.dir=h;await PDFJS_READY;$('ini').innerHTML='<p>Carregando os diários...</p>';await lerPasta();try{await idb('set',h)}catch{}
 G.pasta=`<h2>Pasta dos diários</h2><p>Pasta: <b>${h.name}</b> · ${G.files.length} PDF(s) <button onclick="inicio()">Trocar pasta</button> <button onclick="abrir(G.dir)">Recarregar PDFs</button></p>`;$('ini').innerHTML='';await load()}catch(e){inicio('Não foi possível abrir: '+e.message)}}
async function escolher(){let h;try{h=await showDirectoryPicker({id:'diarios',mode:'readwrite'})}catch(e){if(e.name!='AbortError')inicio(e.name=='SecurityError'?'O Chrome não permite escolher essa pasta diretamente (ex.: Documentos, Downloads ou Mesa). Crie uma subpasta, como "Diários", coloque os PDFs nela e escolha essa subpasta.':'Não foi possível abrir a janela de escolha: '+e.message);return}await abrir(h)}
async function inicio(erro){$('app').innerHTML='';if(!window.Motor||Motor.v!==5){$('wrap').style.display='none';$('ini').innerHTML='<h1>Diário de Classe</h1><p class=r>Os arquivos do site estão com versões diferentes (o motor.js está desatualizado). Envie o index.html e o motor.js juntos para o GitHub e aguarde alguns minutos.</p>';return}$('wrap').style.display='none';if(location.protocol=='file:'){$('ini').innerHTML='<p class=r>Esta página não pode ser aberta direto do arquivo. Abra pelo endereço web (por exemplo http://localhost:8000).</p>';return}if(!window.showDirectoryPicker){$('ini').innerHTML='<p class=r>Abra esta página no Google Chrome ou no Microsoft Edge (o Safari e o Firefox não funcionam).</p>';return}
 let h=null;try{h=await idb('get')}catch{}
 $('ini').innerHTML=(erro?`<p class=r>${erro}</p>`:'')+'<h1>Diário de Classe</h1><p>Escolha a pasta onde estão os PDFs dos diários. A pasta "PDFs gerados" será criada dentro dela.</p><button onclick="escolher()">Carregar pasta dos diários</button> '+(h?`<button onclick="idb('get').then(abrir)">Continuar com a pasta anterior (${h.name})</button>`:'')}
FONTURL='lib/standard_fonts/';PDFJS_READY=import('./lib/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.mjs';window.PDFJS=m});
inicio();
